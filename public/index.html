      <div class="header-nim">20240140004</div>

      <div class="search">
        <input
          type="text"
          id="inputKota"
          value="Jakarta"
          placeholder="Masukkan nama kota..."
        />
        <button onclick="cari()">Search</button>
      </div>

      <div id="loading" class="loading" style="display: none">Memuat...</div>
      <div id="error" class="error" style="display: none"></div>

      <!-- ⬇️ Hasil tampil DI BAWAH input -->
      <div id="hasil">
        <div class="result-row">
          <div class="label">Place Name</div>
          <div class="value" id="place_name">-</div>
        </div>
        <div class="result-row">
          <div class="label">Suhu</div>
          <div class="value suhu-value" id="suhu">-</div>
        </div>
        <div class="result-row">
          <div class="label">Cuaca</div>
          <div class="value" id="cuaca">-</div>
        </div>
        <div class="result-row">
          <div class="label">Koordinat</div>
          <div class="value" id="koordinat">-</div>
        </div>
        <div class="result-row">
          <div class="label">Tipe</div>
          <div class="value" id="tipe">-</div>
        </div>
      </div>
    </div>

    <script>
      const input = document.getElementById("inputKota");

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") cari();
      });

      async function cari() {
        const kota = input.value.trim();
        if (!kota) return;

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const hasil = document.getElementById("hasil");

        loading.style.display = "block";
        error.style.display = "none";
        hasil.style.display = "none";

        try {
          const res = await fetch(
            `/api/lokasi?kota=${encodeURIComponent(kota)}`,
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          document.getElementById("place_name").textContent = data.place_name;
          document.getElementById("suhu").textContent = data.suhu + " °C";
          document.getElementById("cuaca").textContent = data.cuaca;
          document.getElementById("koordinat").textContent =
            data.koordinat[0].toFixed(4) + ", " + data.koordinat[1].toFixed(4);
          document.getElementById("tipe").textContent = data.tipe;

          hasil.style.display = "block";
        } catch (err) {
          error.textContent = "❌ " + err.message;
          error.style.display = "block";
        } finally {
          loading.style.display = "none";
        }
      }

      window.addEventListener("DOMContentLoaded", cari);
    </script>
  </body>
